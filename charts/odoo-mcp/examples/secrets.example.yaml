# -----------------------------------------------------------------------------
# Secrets for charts/odoo-mcp - PLACEHOLDERS ONLY. Never commit real values.
#
# This file lives inside the chart directory, but it is a kubectl manifest, not a
# Helm values file, and .helmignore keeps examples/ out of a packaged chart. So a
# stray `helm install -f examples/secrets.example.yaml` cannot write these
# placeholders over the real Secrets: the keys below are not chart values, and the
# chart renders no Secret at all unless you also set secrets.create=true.
#
# Copy it OUTSIDE the repo, replace every REPLACE_ME value, then apply that copy:
#   kubectl --context woow-k3s -n <tenant> apply -f /secure/path/secrets.yaml
#
# Alternatively let the chart render them for a fresh install or a test:
#   helm install mcp-odoo charts/odoo-mcp -n <tenant> \
#     --set secrets.create=true \
#     --set secrets.odooPassword="$ODOO_PASSWORD" \
#     --set secrets.admin.adminPassword="$ADMIN_PASSWORD" \
#     --set secrets.admin.mcpAuthToken="$MCP_AUTH_TOKEN" \
#     --set secrets.admin.jwtSecret="$JWT_SECRET"
# There is no default for any of them: the chart fails to render without them.
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  # secrets.existingSecret
  name: mcp-odoo-secrets
  namespace: REPLACE_ME_TENANT_NAMESPACE
type: Opaque
stringData:
  # secrets.passwordKey. Password of odoo.username in database odoo.db. The MCP
  # server logs in with it over XML-RPC/JSON-RPC on every call.
  odoo-password: "REPLACE_ME_ODOO_PASSWORD"
---
apiVersion: v1
kind: Secret
metadata:
  # secrets.admin.existingSecret - only needed when admin.enabled=true.
  name: mcp-odoo-admin-secret
  namespace: REPLACE_ME_TENANT_NAMESPACE
type: Opaque
stringData:
  # First-boot seed for the console login. The console can change it afterwards;
  # /data/config.json is then the source of truth.
  ADMIN_PASSWORD: "REPLACE_ME_ADMIN_PASSWORD"
  # First-boot seed for the MCP proxy token, i.e. the /private_<token>/ path
  # segment. Generate with: python3 -c 'import secrets;print(secrets.token_hex(10))'
  MCP_AUTH_TOKEN: "REPLACE_ME_MCP_AUTH_TOKEN"
  # Signs the console's session cookies. Unset means "random on every start",
  # which logs everybody out on every restart.
  JWT_SECRET: "REPLACE_ME_JWT_SECRET"
