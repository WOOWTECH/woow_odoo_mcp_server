{{- /*
Namespace. One that equals the release namespace is skipped: Helm keeps its
release record there, so it is created with --create-namespace instead and can
never be deleted by `helm uninstall`. In the live tenants the namespace belongs
to the Odoo deployment, not to this chart - leave namespace.create=false there.
*/ -}}
{{- if .Values.namespace.create }}
{{- if ne (include "odoo-mcp.ns" .) .Release.Namespace }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "odoo-mcp.ns" . }}
  {{- with (include "odoo-mcp.labels" .) }}
  {{- . | nindent 2 }}
  {{- end }}
  {{- include "odoo-mcp.keepAnnotations" . | nindent 2 }}
{{- end }}
{{- end }}
