{{- /*
Side-effect allow-list mounted at ODOO_MCP_POLICY_FILE. Methods NOT listed here
are refused by the MCP server even when writes are enabled, so this file - not
the GUI toggles - is the precise lever for what an agent may trigger in Odoo.
*/ -}}
{{- /*
`policy.create: false` mounts a policy ConfigMap that already exists instead of
rendering one. Two MCP instances in the same namespace share a single policy
file, and only one release may own that object.
*/ -}}
{{- if and .Values.server.enabled .Values.policy.enabled .Values.policy.create }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "odoo-mcp.policyConfigMap" . }}
  namespace: {{ include "odoo-mcp.ns" . }}
  {{- with (include "odoo-mcp.labels" .) }}
  {{- . | nindent 2 }}
  {{- end }}
data:
  odoo_mcp_policy.json: |
    {
      "allowed_side_effect_methods": [
    {{- $last := sub (len .Values.policy.allowedSideEffectMethods) 1 }}
    {{- range $i, $m := .Values.policy.allowedSideEffectMethods }}
        {{ $m | quote }}{{ if ne $i $last }},{{ end }}
    {{- end }}
      ]
    }
{{- end }}
