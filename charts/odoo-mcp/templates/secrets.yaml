{{- /*
Credentials this chart references.

secrets.create is false by default: the Secrets already exist in the tenant
namespace (created out of band from examples/secrets.example.yaml) and this
chart only references them, so no upgrade can overwrite a real password with an
empty string. secrets.create=true is for fresh installs and tests, and every
value it needs is required() - there is no default password anywhere in this
chart.
*/ -}}
{{- if .Values.secrets.create }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.existingSecret }}
  namespace: {{ include "odoo-mcp.ns" . }}
  {{- with (include "odoo-mcp.labels" .) }}
  {{- . | nindent 2 }}
  {{- end }}
  {{- include "odoo-mcp.keepAnnotations" . | nindent 2 }}
type: Opaque
stringData:
  {{ .Values.secrets.passwordKey }}: {{ required "secrets.odooPassword is required when secrets.create=true" .Values.secrets.odooPassword | quote }}
{{- if .Values.admin.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.admin.existingSecret }}
  namespace: {{ include "odoo-mcp.ns" . }}
  {{- with (include "odoo-mcp.labels" .) }}
  {{- . | nindent 2 }}
  {{- end }}
  {{- include "odoo-mcp.keepAnnotations" . | nindent 2 }}
type: Opaque
stringData:
  ADMIN_PASSWORD: {{ required "secrets.admin.adminPassword is required when secrets.create=true and admin.enabled=true" .Values.secrets.admin.adminPassword | quote }}
  MCP_AUTH_TOKEN: {{ required "secrets.admin.mcpAuthToken is required when secrets.create=true and admin.enabled=true" .Values.secrets.admin.mcpAuthToken | quote }}
  JWT_SECRET: {{ required "secrets.admin.jwtSecret is required when secrets.create=true and admin.enabled=true" .Values.secrets.admin.jwtSecret | quote }}
{{- end }}
{{- end }}
