{{- /*
The Odoo MCP server: ghcr.io/woowtech/woow-odoo-mcp-server running
`python3 -m odoo_mcp` over streamable HTTP on :8000, after the WOOWTECH patches
in files/patches/ have been applied into the image at start.

Field order and content mirror the objects created by kubectl apply in every
standard tenant, so `helm template` with deploy/woow-k3s/<tenant>.yaml renders
those objects exactly (see README "Takeover").
*/ -}}
{{- if .Values.server.enabled }}
{{- if and .Values.initConfig.enabled (not .Values.persistence.enabled) }}
{{- fail "initConfig.enabled=true needs persistence.enabled=true: /data/config.json is seeded by an init container into the data volume, so without that volume the seed container is not rendered, /data is not mounted and MCP_ADMIN_CONFIG=/data/config.json would point at nothing" }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "odoo-mcp.name" . }}
  namespace: {{ include "odoo-mcp.ns" . }}
  {{- with (include "odoo-mcp.labels" .) }}
  {{- . | nindent 2 }}
  {{- end }}
spec:
  replicas: {{ .Values.server.replicas }}
  selector:
    matchLabels:
      app: {{ include "odoo-mcp.name" . }}
  template:
    metadata:
      {{- with .Values.server.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        app: {{ include "odoo-mcp.name" . }}
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - command:
        - sh
        - -c
        - {{ include "odoo-mcp.serverCommand" . | quote }}
        env:
        {{- /*
        ENV ORDER IS LOAD-BEARING. It is part of the pod template, so a
        takeover that reorders it rolls the pod even though nothing about the
        container actually changed. Four orderings are live across the Odoo
        tenants (different vintages of the original kubectl manifests), so the
        order is data, not template structure: `server.envOrder` lists the
        names to emit and in what sequence, and a name left out is not emitted
        at all. That is also how the in-process-admin shape drops MCP_TRANSPORT
        and the MCP_HTTP_* trio - it simply does not list them.
        */ -}}
        {{- $v := dict
            "ODOO_URL" (required "odoo.url is required" .Values.odoo.url)
            "ODOO_DB" (required "odoo.db is required" .Values.odoo.db)
            "ODOO_USERNAME" (required "odoo.username is required" .Values.odoo.username)
            "ODOO_TIMEOUT" .Values.odoo.timeout
            "ODOO_MCP_ENABLE_WRITES" .Values.server.enableWrites
            "ODOO_MCP_ALLOW_DIRECT_WRITES" .Values.server.allowDirectWrites
            "ODOO_MCP_ALLOW_UNKNOWN_METHODS" .Values.server.allowUnknownMethods
            "ODOO_MCP_ELICIT_WRITES" .Values.server.elicitWrites
            "ODOO_MCP_MAX_ATTACHMENT_BYTES" .Values.server.maxAttachmentBytes
            "MCP_CHATTER_DIRECT" .Values.server.chatterDirect
            "MCP_TRANSPORT" .Values.server.transport
            "MCP_HTTP_HOST" "0.0.0.0"
            "MCP_HTTP_PORT" .Values.server.port
            "MCP_HTTP_PATH" .Values.server.path
            "MCP_ALLOWED_HOSTS" (include "odoo-mcp.allowedHosts" .)
            "MCP_ALLOW_REMOTE_HTTP" .Values.server.allowRemoteHttp
        -}}
        {{- /*
        Three vars exist only when the feature behind them does. Listing one in
        envOrder without its feature is a no-op rather than an error, so a
        single envOrder can describe a tenant with or without the policy file.
        Any OTHER unknown name is a typo and fails the render.
        */ -}}
        {{- if .Values.odoo.verifySsl }}
        {{- $v = set $v "ODOO_VERIFY_SSL" .Values.odoo.verifySsl -}}
        {{- end }}
        {{- if .Values.policy.enabled }}
        {{- $v = set $v "ODOO_MCP_POLICY_FILE" .Values.policy.mountPath -}}
        {{- end }}
        {{- if .Values.initConfig.enabled }}
        {{- $v = set $v "MCP_ADMIN_CONFIG" "/data/config.json" -}}
        {{- end }}
        {{- $optional := list "ODOO_VERIFY_SSL" "ODOO_MCP_POLICY_FILE" "MCP_ADMIN_CONFIG" -}}
        {{- range $name := .Values.server.envOrder }}
        {{- if eq $name "ODOO_PASSWORD" }}
        - name: ODOO_PASSWORD
          valueFrom:
            secretKeyRef:
              key: {{ $.Values.secrets.passwordKey }}
              name: {{ $.Values.secrets.existingSecret }}
        {{- else if hasKey $v $name }}
        - name: {{ $name }}
          value: {{ index $v $name | quote }}
        {{- else if not (has $name $optional) }}
        {{- fail (printf "server.envOrder lists %s, which this chart has no value for. Add it to the dict in templates/server.yaml or fix the name." $name) }}
        {{- end }}
        {{- end }}
        {{- with .Values.server.extraEnv }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        name: {{ include "odoo-mcp.name" . }}
        {{- with .Values.server.livenessProbe }}
        livenessProbe:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.server.readinessProbe }}
        readinessProbe:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        ports:
        - containerPort: {{ .Values.server.port }}
        resources:
          {{- toYaml .Values.server.resources | nindent 10 }}
        {{- if or .Values.policy.enabled .Values.server.applyPatches .Values.persistence.enabled .Values.server.extraVolumes }}
        volumeMounts:
        {{- if .Values.policy.enabled }}
        - mountPath: {{ .Values.policy.mountPath }}
          name: policy
          subPath: odoo_mcp_policy.json
        {{- end }}
        {{- if .Values.server.applyPatches }}
        - mountPath: /app/patches
          name: patch-script
          readOnly: true
        {{- end }}
        {{- with .Values.server.extraVolumeMounts }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.persistence.enabled }}
        - mountPath: /data
          name: data
        {{- end }}
        {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- if and .Values.initConfig.enabled .Values.persistence.enabled }}
      initContainers:
      - command:
        - sh
        - -c
        {{- if .Values.initConfig.keepExisting }}
        - '[ -f /data/config.json ] || cp /config-src/config.json /data/config.json'
        {{- else }}
        - cp /config-src/config.json /data/config.json
        {{- end }}
        {{- if kindIs "invalid" .Values.initConfig.env }}
        env:
        - name: ODOO_MCP_ALLOW_UNKNOWN_METHODS
          value: {{ .Values.server.allowUnknownMethods | quote }}
        {{- else if .Values.initConfig.env }}
        env:
        {{- toYaml .Values.initConfig.env | nindent 8 }}
        {{- end }}
        image: {{ .Values.busybox.image }}
        imagePullPolicy: {{ .Values.busybox.pullPolicy }}
        name: init-config
        resources: {}
        volumeMounts:
        - mountPath: /config-src
          name: config-src
        - mountPath: /data
          name: data
      {{- end }}
      {{- if or .Values.policy.enabled .Values.server.applyPatches .Values.persistence.enabled .Values.server.extraVolumes }}
      volumes:
      {{- if .Values.policy.enabled }}
      - configMap:
          name: {{ include "odoo-mcp.policyConfigMap" . }}
        name: policy
      {{- end }}
      {{- if .Values.server.applyPatches }}
      - configMap:
          name: {{ include "odoo-mcp.patchConfigMap" . }}
        name: patch-script
      {{- end }}
      {{- with .Values.server.extraVolumes }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- if and .Values.initConfig.enabled .Values.persistence.enabled }}
      - configMap:
          name: {{ required "initConfig.existingConfigMap is required when initConfig.enabled=true" .Values.initConfig.existingConfigMap }}
        name: config-src
      {{- end }}
      {{- if .Values.persistence.enabled }}
      - name: data
        {{- if .Values.persistence.emptyDir }}
        {{- /*
        Several live tenants back /data with an emptyDir, not a PVC: config.json
        is copied in by the init container on every start, so nothing needs to
        survive a restart. Rendering a PVC for them would change the pod template
        and roll the pod on takeover.
        */}}
        emptyDir: {}
        {{- else }}
        persistentVolumeClaim:
          claimName: {{ include "odoo-mcp.dataClaim" . }}
        {{- end }}
      {{- end }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "odoo-mcp.name" . }}
  namespace: {{ include "odoo-mcp.ns" . }}
  {{- with (include "odoo-mcp.labels" .) }}
  {{- . | nindent 2 }}
  {{- end }}
spec:
  ports:
  - port: {{ .Values.server.port }}
    targetPort: {{ .Values.server.port }}
  selector:
    app: {{ include "odoo-mcp.name" . }}
{{- end }}
