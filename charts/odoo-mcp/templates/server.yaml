{{- /*
The Odoo MCP server: ghcr.io/woowtech/woow-odoo-mcp-server running
`python3 -m odoo_mcp` over streamable HTTP on :8000, after the WOOWTECH patches
in files/patches/ have been applied into the image at start.

Field order and content mirror the objects created by kubectl apply in every
standard tenant, so `helm template` with deploy/woow-k3s/<tenant>.yaml renders
those objects exactly (see README "Takeover").
*/ -}}
{{- if .Values.server.enabled }}
{{- if and .Values.initConfig.enabled (not .Values.persistence.enabled) }}
{{- fail "initConfig.enabled=true needs persistence.enabled=true: /data/config.json is seeded by an init container into the data volume, so without that volume the seed container is not rendered, /data is not mounted and MCP_ADMIN_CONFIG=/data/config.json would point at nothing" }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "odoo-mcp.name" . }}
  namespace: {{ include "odoo-mcp.ns" . }}
  {{- with (include "odoo-mcp.labels" .) }}
  {{- . | nindent 2 }}
  {{- end }}
spec:
  replicas: {{ .Values.server.replicas }}
  selector:
    matchLabels:
      app: {{ include "odoo-mcp.name" . }}
  template:
    metadata:
      {{- with .Values.server.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        app: {{ include "odoo-mcp.name" . }}
    spec:
      containers:
      - command:
        - sh
        - -c
        - {{ include "odoo-mcp.serverCommand" . | quote }}
        env:
        {{- if .Values.initConfig.enabled }}
        - name: MCP_ADMIN_CONFIG
          value: /data/config.json
        {{- end }}
        - name: ODOO_URL
          value: {{ required "odoo.url is required" .Values.odoo.url | quote }}
        - name: ODOO_DB
          value: {{ required "odoo.db is required" .Values.odoo.db | quote }}
        - name: ODOO_USERNAME
          value: {{ required "odoo.username is required" .Values.odoo.username | quote }}
        - name: ODOO_PASSWORD
          valueFrom:
            secretKeyRef:
              key: {{ .Values.secrets.passwordKey }}
              name: {{ .Values.secrets.existingSecret }}
        - name: ODOO_TIMEOUT
          value: {{ .Values.odoo.timeout | quote }}
        - name: ODOO_VERIFY_SSL
          value: {{ .Values.odoo.verifySsl | quote }}
        - name: ODOO_MCP_ENABLE_WRITES
          value: {{ .Values.server.enableWrites | quote }}
        - name: ODOO_MCP_ALLOW_DIRECT_WRITES
          value: {{ .Values.server.allowDirectWrites | quote }}
        - name: ODOO_MCP_ALLOW_UNKNOWN_METHODS
          value: {{ .Values.server.allowUnknownMethods | quote }}
        - name: ODOO_MCP_ELICIT_WRITES
          value: {{ .Values.server.elicitWrites | quote }}
        - name: ODOO_MCP_MAX_ATTACHMENT_BYTES
          value: {{ .Values.server.maxAttachmentBytes | quote }}
        {{- if .Values.policy.enabled }}
        - name: ODOO_MCP_POLICY_FILE
          value: {{ .Values.policy.mountPath }}
        {{- end }}
        - name: MCP_TRANSPORT
          value: {{ .Values.server.transport }}
        - name: MCP_HTTP_HOST
          value: 0.0.0.0
        - name: MCP_HTTP_PORT
          value: {{ .Values.server.port | quote }}
        - name: MCP_HTTP_PATH
          value: {{ .Values.server.path }}
        - name: MCP_ALLOW_REMOTE_HTTP
          value: {{ .Values.server.allowRemoteHttp | quote }}
        - name: MCP_ALLOWED_HOSTS
          value: {{ include "odoo-mcp.allowedHosts" . }}
        - name: MCP_CHATTER_DIRECT
          value: {{ .Values.server.chatterDirect | quote }}
        {{- with .Values.server.extraEnv }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        name: {{ include "odoo-mcp.name" . }}
        ports:
        - containerPort: {{ .Values.server.port }}
        resources:
          {{- toYaml .Values.server.resources | nindent 10 }}
        {{- if or .Values.policy.enabled .Values.server.applyPatches .Values.persistence.enabled }}
        volumeMounts:
        {{- if .Values.policy.enabled }}
        - mountPath: {{ .Values.policy.mountPath }}
          name: policy
          subPath: odoo_mcp_policy.json
        {{- end }}
        {{- if .Values.server.applyPatches }}
        - mountPath: /app/patches
          name: patch-script
          readOnly: true
        {{- end }}
        {{- if .Values.persistence.enabled }}
        - mountPath: /data
          name: data
        {{- end }}
        {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- if and .Values.initConfig.enabled .Values.persistence.enabled }}
      initContainers:
      - command:
        - sh
        - -c
        {{- if .Values.initConfig.keepExisting }}
        - '[ -f /data/config.json ] || cp /config-src/config.json /data/config.json'
        {{- else }}
        - cp /config-src/config.json /data/config.json
        {{- end }}
        env:
        - name: ODOO_MCP_ALLOW_UNKNOWN_METHODS
          value: {{ .Values.server.allowUnknownMethods | quote }}
        image: {{ .Values.busybox.image }}
        imagePullPolicy: {{ .Values.busybox.pullPolicy }}
        name: init-config
        resources: {}
        volumeMounts:
        - mountPath: /config-src
          name: config-src
        - mountPath: /data
          name: data
      {{- end }}
      {{- if or .Values.policy.enabled .Values.server.applyPatches .Values.persistence.enabled }}
      volumes:
      {{- if .Values.policy.enabled }}
      - configMap:
          name: {{ include "odoo-mcp.policyConfigMap" . }}
        name: policy
      {{- end }}
      {{- if .Values.server.applyPatches }}
      - configMap:
          name: {{ include "odoo-mcp.patchConfigMap" . }}
        name: patch-script
      {{- end }}
      {{- if and .Values.initConfig.enabled .Values.persistence.enabled }}
      - configMap:
          name: {{ required "initConfig.existingConfigMap is required when initConfig.enabled=true" .Values.initConfig.existingConfigMap }}
        name: config-src
      {{- end }}
      {{- if .Values.persistence.enabled }}
      - name: data
        persistentVolumeClaim:
          claimName: {{ include "odoo-mcp.dataClaim" . }}
      {{- end }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "odoo-mcp.name" . }}
  namespace: {{ include "odoo-mcp.ns" . }}
  {{- with (include "odoo-mcp.labels" .) }}
  {{- . | nindent 2 }}
  {{- end }}
spec:
  ports:
  - port: {{ .Values.server.port }}
    targetPort: {{ .Values.server.port }}
  selector:
    app: {{ include "odoo-mcp.name" . }}
{{- end }}
