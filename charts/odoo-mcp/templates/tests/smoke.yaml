{{- /*
`helm test` smoke pod. READ-ONLY: it opens HTTP connections and reads the nginx
ConfigMap it is given; it never writes to Odoo and never calls a tool that has a
side effect.

  1. the MCP server answers on :{{ .Values.server.port }} - a bare GET on the MCP
     path must reach the application, not a closed port
  2. the proxy returns 403 for every path outside /private_<token>/
  3. a real MCP `initialize` handshake through /private_<token>{{ .Values.server.path }}
     returns a JSON-RPC result with serverInfo. `initialize` has no side effect:
     it neither reads nor writes a single Odoo record.
  4. the admin console answers GET /healthz with 200 (when admin.enabled)

The token is read from the mounted ConfigMap, never passed as an argument, so it
cannot end up in `kubectl describe` or in an audit log.

Every connection is retried until tests.timeoutSeconds, so `helm test` run
immediately after `helm install` waits for the server instead of failing.
*/ -}}
{{- if .Values.tests.enabled }}
---
apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}-smoke
  namespace: {{ include "odoo-mcp.ns" . }}
  {{- with .Values.extraLabels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  annotations:
    helm.sh/hook: test
    # Kept until the next `helm test` so `helm test --logs` can always read it.
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  restartPolicy: Never
  {{- with .Values.nodeSelector }}
  nodeSelector:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  containers:
    - name: smoke
      image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      command: [python3, -c]
      args:
        - |
          import json, os, re, sys, time, urllib.error, urllib.request

          deadline = time.time() + float(os.environ["SMOKE_TIMEOUT"])

          def call(url, data=None, headers=None):
              req = urllib.request.Request(url, data=data, headers=headers or {},
                                           method="POST" if data else "GET")
              while True:
                  try:
                      with urllib.request.urlopen(req, timeout=60) as r:
                          return r.status, r.read(4000).decode("utf-8", "replace")
                  except urllib.error.HTTPError as e:
                      # An answer is an answer: 403 and 421 are results, not failures.
                      return e.code, e.read(4000).decode("utf-8", "replace")
                  except OSError as e:
                      # Retry until SMOKE_TIMEOUT. Two real reasons, both transient:
                      # the MCP server has no readiness probe (the live Deployments
                      # have none and this chart renders them field for field), so
                      # `helm test` straight after `helm install` can arrive before
                      # uvicorn listens; and a pod's very first packets can be lost
                      # while its own CNI rules settle, which shows up as
                      # ECONNREFUSED in the first second of its life.
                      if time.time() > deadline:
                          raise
                      print("waiting for %s (%s)" % (url, e), flush=True)
                      time.sleep(3)

          server = os.environ.get("SERVER_URL")
          if server:
              code, _ = call(server)
              assert code, code
              print("mcp server %s -> HTTP %s (serving)" % (server, code))

          proxy = os.environ.get("PROXY_URL")
          if proxy:
              code, body = call(proxy + "/")
              assert code == 403, "proxy root should be 403, got %s %s" % (code, body)
              print("proxy root -> 403 (token required)")
              conf = open("/nginx/nginx.conf").read()
              m = re.search(r"location /private_([^/]+)/", conf)
              assert m, "no /private_<token>/ location in the proxy config"
              url = "%s/private_%s%s" % (proxy, m.group(1), os.environ["MCP_PATH"])
              # A real MCP handshake. initialize touches no Odoo record.
              payload = json.dumps({
                  "jsonrpc": "2.0", "id": 1, "method": "initialize",
                  "params": {"protocolVersion": "2025-06-18", "capabilities": {},
                             "clientInfo": {"name": "helm-test-smoke", "version": "1"}},
              }).encode()
              code, body = call(url, payload, {
                  "Content-Type": "application/json",
                  "Accept": "application/json, text/event-stream"})
              assert code == 200, "MCP initialize through the proxy: %s %s" % (code, body)
              # streamable HTTP answers as SSE: one "data: {json}" line.
              line = next(l for l in body.splitlines() if l.startswith("data: "))
              result = json.loads(line[len("data: "):])["result"]
              print("mcp initialize -> %s %s (protocol %s)" % (
                  result["serverInfo"]["name"], result["serverInfo"]["version"],
                  result["protocolVersion"]))

          admin = os.environ.get("ADMIN_URL")
          if admin:
              code, body = call(admin + "/healthz")
              assert code == 200, "admin /healthz %s %s" % (code, body)
              print("admin /healthz -> 200", body.strip()[:120])

          print("SMOKE OK")
      env:
        - name: SMOKE_TIMEOUT
          value: {{ .Values.tests.timeoutSeconds | quote }}
        {{- if .Values.server.enabled }}
        - name: SERVER_URL
          value: http://{{ include "odoo-mcp.name" . }}:{{ .Values.server.port }}{{ .Values.server.path }}
        {{- end }}
        {{- if .Values.proxy.enabled }}
        - name: PROXY_URL
          value: http://{{ include "odoo-mcp.proxyName" . }}:{{ .Values.proxy.port }}
        {{- end }}
        - name: MCP_PATH
          value: {{ .Values.server.path }}
        {{- if .Values.admin.enabled }}
        - name: ADMIN_URL
          value: http://{{ include "odoo-mcp.adminName" . }}:{{ .Values.admin.port }}
        {{- end }}
      {{- if .Values.proxy.enabled }}
      volumeMounts:
        - mountPath: /nginx
          name: nginx-config
          readOnly: true
      {{- end }}
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          cpu: 500m
          memory: 256Mi
  {{- if .Values.proxy.enabled }}
  volumes:
    - name: nginx-config
      configMap:
        name: {{ include "odoo-mcp.proxyConfigMap" . }}
  {{- end }}
{{- end }}
