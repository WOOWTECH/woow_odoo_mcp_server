# Default values for the odoo-mcp chart.
#
# One release per Odoo tenant. The defaults are the SHAPE of a standard tenant
# (see deploy/woow-k3s/komibright.yaml for a live instance); the tenant-specific
# values - namespace, Odoo URL/DB, allowed hosts, proxy token - have no usable
# default and must be supplied.
#
# NOTHING secret belongs in this file or in deploy/woow-k3s/*.yaml. The Odoo
# password lives in a Secret (secrets.existingSecret) and the MCP proxy token
# lives in the proxy ConfigMap that already exists in the cluster
# (proxy.config.existingConfigMap). See examples/secrets.example.yaml.

namespace:
  # Render a Namespace object. A namespace equal to the release namespace (-n)
  # is never rendered - create it with --create-namespace instead - so
  # `helm uninstall` can never delete the namespace the release lives in.
  create: false
  # Name of that Namespace OBJECT only ("" = .Release.Namespace, i.e. nothing is
  # rendered). It can NEVER move this release's own objects: every Deployment,
  # Service, ConfigMap, Secret and PVC always follows -n / --namespace. A key
  # that could silently retarget them would let a rehearsal write to a live
  # tenant namespace, so this one deliberately cannot.
  name: ""

# Add `helm.sh/resource-policy: keep` to Namespaces, PVCs and chart-created
# Secrets, so `helm uninstall` never deletes tenant data.
keepOnUninstall: true

# Default StorageClass for every PVC. "longhorn" on woow-k3s uses reclaimPolicy
# Retain. Use "longhorn-delete" for throwaway test installs, "local-path" on the
# laptop cluster.
storageClassName: longhorn

# Base name for every object: <baseName>, <baseName>-proxy,
# <baseName>-proxy-config, <baseName>-policy, <baseName>-patch, <baseName>-admin.
# Tenants that run a second MCP for another database use e.g. "mcp-odoo-social".
baseName: mcp-odoo

# Pod selector labels. IMMUTABLE on a live Deployment - the API server rejects
# an update that changes spec.selector - so a takeover MUST set whatever is
# already there. Empty means `app: <baseName>`, which is what the standard
# tenants have; the tenants whose MCP was deployed as part of a full Odoo stack
# carry app.kubernetes.io/* labels instead and set them here.
selectorLabels: {}
# Pod-level securityContext (the tenant-stack MCPs set fsGroup) and service
# account token mounting. null leaves automountServiceAccountToken unset.
podSecurityContext: {}
automountServiceAccountToken: null
# Extra labels on the pod template only (a superset of the selector). Unlike
# extraLabels these ARE part of the pod template, so changing one rolls the pod.
podLabels: {}

service:
  # Service name when it differs from baseName (the tenant-stack MCPs use
  # <tenant>-odoo-mcp-svc).
  name: ""
  # Explicit port list. Empty renders the single MCP port; the sidecar shape
  # publishes the MCP and proxy ports on this one Service.
  ports: []

# Extra labels added to every object's metadata (NOT to pod templates, so adding
# one can never roll a running pod). Empty by default: the live objects were
# created by kubectl apply and carry no labels, and criterion 1 compares them
# field by field.
extraLabels: {}

image:
  repository: ghcr.io/woowtech/woow-odoo-mcp-server
  # The GHCR package is private and only ever publishes :latest. Pin a digest
  # here once the repo builds tagged images (see README "Follow-ups").
  tag: latest
  pullPolicy: Always
# Pull secret for the private GHCR package. [] disables it.
imagePullSecrets:
  - name: mcp-admin-ghcr

busybox:
  image: busybox:latest
  pullPolicy: Always

# Node placement for every pod this chart creates (server, proxy, console and
# the `helm test` pod). Empty by default, so nothing is added to any live pod
# template - `helm template` with the instance values is unchanged by this key.
# A test install uses it to land on a node that already has the private image in
# its containerd cache, which is what makes a functional test possible without
# copying a tenant's GHCR pull secret (see README "Testing without the private
# image").
nodeSelector: {}

odoo:
  # Required. https://<tenant>-odoo.woowtech.io
  url: ""
  # Required. Odoo database name.
  db: ""
  username: admin
  timeout: "30"
  verifySsl: "1"

secrets:
  # false (default): the Secret already exists in the namespace (created from
  #   examples/secrets.example.yaml) and the chart never renders it, so a
  #   `helm upgrade` can never overwrite the real Odoo password with an empty
  #   value.
  # true: render the Secret from odooPassword below (fresh installs, tests).
  create: false
  existingSecret: mcp-odoo-secrets
  passwordKey: odoo-password
  # ONE live pod carries the Odoo password as a plain env value rather than a
  # secretKeyRef. Reproducing that pod template exactly is the only way to take
  # it over without a restart, so the chart can render it - but NEVER commit a
  # value here. The instance file holds "__ODOO_PASSWORD__" and the real value
  # is passed with --set-string at takeover time. Empty means secretKeyRef,
  # which is what every other instance uses and what this one should move to.
  plainPassword: ""
  # Only read when create=true; required() then. NEVER commit a value here.
  odooPassword: ""
  # Credentials for the admin console (admin.enabled). Same rule: the Secret
  # normally already exists and these stay empty.
  admin:
    existingSecret: mcp-odoo-admin-secret
    adminPassword: ""
    mcpAuthToken: ""
    jwtSecret: ""

server:
  enabled: true
  replicas: 1
  # Run patches/*.py (shipped in files/patches/) before starting the server.
  # This is what the live tenants do; it is also what the -patch ConfigMap is for.
  # Run the admin API inside the SAME container as the MCP server, instead of
  # as a separate Deployment (admin.enabled). `odoo-mcp` is backgrounded and
  # uvicorn takes PID 1. This is what most live tenants actually run; it
  # applies no patches and uses the `odoo-mcp` console script, so it overrides
  # applyPatches when enabled.
  inProcessAdmin:
    enabled: false
    port: 8080
  applyPatches: true
  # How the patch-then-start command is joined: `inline` for one long
  # `a && b && c` line, `continuation` for `a \`+newline+`&& b ...` with a
  # trailing newline. Both are live; see the comment in _helpers.tpl.
  patchCommandStyle: inline
  port: 8000
  path: /mcp
  # Hosts the streamable-HTTP server accepts a Host header for. Required:
  # an empty list would make every request fail the DNS-rebinding check.
  allowedHosts: []
  # Extra pod-template annotations. Live tenants carry the
  # kubectl.kubernetes.io/restartedAt stamp left by `kubectl rollout restart`;
  # it is part of the pod template, so it is carried in the instance values to
  # keep a takeover from rolling the pod.
  podAnnotations: {}
  # odoo-mcp feature switches, rendered as env in the order the live pods use.
  enableWrites: "1"
  allowDirectWrites: "1"
  allowUnknownMethods: "1"
  elicitWrites: "0"
  maxAttachmentBytes: "16777216"
  chatterDirect: "1"
  allowRemoteHttp: "1"
  transport: streamable-http
  # Appended after the standard env block.
  extraEnv: []
  # Which env vars the server container gets, and in what order. Order is part
  # of the pod template, so this is per-instance data taken off the live pod -
  # see the comment in templates/server.yaml. A name not listed is not emitted;
  # ODOO_PASSWORD always renders as a secretKeyRef. The default below is the
  # most common live vintage.
  envOrder:
    - ODOO_URL
    - ODOO_DB
    - ODOO_USERNAME
    - ODOO_PASSWORD
    - ODOO_TIMEOUT
    - ODOO_VERIFY_SSL
    - ODOO_MCP_ENABLE_WRITES
    - ODOO_MCP_ALLOW_DIRECT_WRITES
    - ODOO_MCP_ALLOW_UNKNOWN_METHODS
    - ODOO_MCP_ELICIT_WRITES
    - ODOO_MCP_MAX_ATTACHMENT_BYTES
    - ODOO_MCP_POLICY_FILE
    - MCP_TRANSPORT
    - MCP_HTTP_HOST
    - MCP_HTTP_PORT
    - MCP_HTTP_PATH
    - MCP_ADMIN_CONFIG
    - MCP_ALLOWED_HOSTS
    - MCP_ALLOW_REMOTE_HTTP
    - MCP_CHATTER_DIRECT
  # Extra volumes/mounts on the server container, rendered in the same slot the
  # patch-script volume occupies. One tenant overlays a single patched
  # server_core.py from a ConfigMap this way instead of running the patch
  # scripts; the slot matters because volume list order is part of the template.
  extraVolumes: []
  extraVolumeMounts: []
  # Replaces the generated start command entirely, verbatim. For the one tenant
  # whose pod boots through an embedded Python program instead of any shape this
  # chart models - see the comment in templates/server.yaml.
  commandOverride: []
  # Pass --allow-remote-http on the command line. null follows allowRemoteHttp;
  # one live tenant sets the env var but not the flag.
  commandAllowRemoteHttp: null
  # Explicit container port list, when the live pod declares more than one.
  ports: []
  # The server container's volumeMounts / the pod's volumes, verbatim. Same
  # reasoning as commandOverride - see templates/server.yaml. Setting either
  # means the chart derives nothing for that list.
  volumeMountsOverride: []
  volumesOverride: []
  # Container name. Defaults to baseName, which is `mcp-odoo` for the standard
  # tenants - but the tenant-stack MCPs have a Deployment called
  # <tenant>-mcp-odoo whose container is still plain `mcp-odoo`.
  containerName: ""
  # Name on the container port, when the live pod names it.
  portName: ""
  securityContext: {}
  startupProbe: {}
  # Probes on the MCP server container. Empty by default because most live
  # tenants have none; the ones that do carry a tcpSocket check on server.port
  # and it is part of their pod template, so a takeover has to reproduce it.
  livenessProbe: {}
  readinessProbe: {}
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Side-effect allow-list mounted at /app/odoo_mcp_policy.json. This is the
# gate that decides which Odoo button methods the MCP may call; see
# MEMORY "Odoo MCP 副作用閘門".
policy:
  enabled: true
  # Render the ConfigMap, or only mount one that already exists. false when two
  # MCP releases in one namespace share a single policy file.
  create: true
  mountPath: /app/odoo_mcp_policy.json
  # Volume name and ConfigMap name. The tenant-stack MCPs call them
  # `mcp-policy` / `<tenant>-odoo-mcp-policy` and mount the file read-only.
  volumeName: policy
  configMapName: ""
  readOnly: false
  allowedSideEffectMethods:
    - sale.order.action_confirm
    - sale.order.action_cancel
    - sale.order.action_draft
    - stock.picking.button_validate
    - stock.picking.action_cancel
    - stock.quant.action_apply_inventory
    - account.move.action_post
    - account.move.button_draft
    - account.move.button_cancel
    - pos.session.action_pos_session_closing_control
    - pos.session.open_frontend_cb
    - loyalty.card.action_archive
    - ir.module.module.button_immediate_install
    - ir.module.module.button_immediate_uninstall
    - res.users.action_reset_password
    - product.template.action_archive
    - product.template.action_unarchive

# /data on the MCP server pod. Live standard tenants mount a 1Gi Longhorn PVC
# there (the admin console's config.json); a plain server-only install does not
# need it.
persistence:
  enabled: false
  # Back /data with an emptyDir instead of a PVC. Several live tenants do this:
  # the init container copies config.json in on every start, so nothing has to
  # survive a restart. No PVC is rendered when this is true.
  emptyDir: false
  # Name of the PVC. Kept separate from baseName: the live claim is
  # "mcp-admin-data" in most tenants.
  name: mcp-admin-data
  # Name of the VOLUME inside the pod (not the claim). Part of the pod template.
  volumeName: data
  # Bind to a PVC that already exists instead of rendering one.
  existingClaim: ""
  accessMode: ReadWriteOnce
  size: 1Gi
  # "" = storageClassName
  className: ""

# Seed /data/config.json from an EXISTING ConfigMap before the server starts.
# The chart never renders that ConfigMap: in the live tenants it holds the admin
# password, the MCP token and the Odoo password in clear text, so it stays a
# cluster object and never enters git. Moving it to a Secret is a follow-up.
initConfig:
  # Needs persistence.enabled=true - the seed is written into the data volume.
  # The chart fails to render on enabled=true without it, rather than producing a
  # pod that expects /data/config.json and has no /data.
  enabled: false
  existingConfigMap: mcp-admin-config
  # Copy unconditionally (live behaviour) or only when /data/config.json is
  # missing. `true` is opt-in because it changes a live pod template.
  keepExisting: false
  # Env on the init container. It only runs `cp`, so these are inert - but the
  # live pod templates carry per-tenant sets of them and the takeover has to
  # reproduce whatever is there byte-for-byte. Leave unset (null) to keep the
  # historical single ODOO_MCP_ALLOW_UNKNOWN_METHODS var; set `[]` for tenants
  # whose init container has no env at all; set an explicit list otherwise.
  env: null
  # Raw seed command, replacing the generated `cp`. For tenants whose init
  # container copies more than config.json, or checks for the files first.
  command: []
  # Volume that carries the seed files, and where it is mounted.
  sourceVolumeName: config-src
  sourceMountPath: /config-src
  # One tenant lists /data before the seed volume, in both the init container's
  # mounts and the pod's volume list. Order is part of the pod template.
  dataFirst: false

proxy:
  # nginx in front of the MCP server: only /private_<token>/... is proxied,
  # everything else gets 403. This is the only authentication in front of the
  # MCP endpoint.
  enabled: true
  replicas: 1
  image:
    repository: nginx
    tag: alpine
    pullPolicy: IfNotPresent
  port: 8001
  # Long-lived SSE/streamable-HTTP connections.
  readTimeout: 86400s
  sendTimeout: 86400s
  podAnnotations: {}
  config:
    # false (default): mount the nginx ConfigMap that already exists in the
    #   namespace. The rendered config contains the MCP proxy token, so the
    #   chart must not be the place that carries it.
    # true: render it from authToken below (fresh installs, tests).
    create: false
    existingConfigMap: ""
    # Only read when create=true; required() then. NEVER commit a value here.
    authToken: ""
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 100m
      memory: 64Mi
  # Where the nginx token gate runs:
  #   deployment - its own Deployment and Service (the standard tenants)
  #   sidecar    - a second container in the MCP pod, with both ports published
  #                on the MCP Service (the tenants whose MCP was deployed as
  #                part of a full Odoo stack)
  mode: deployment
  containerName: mcp-odoo-proxy
  # Name on the container port, when the live pod names it.
  portName: ""
  # The name of the nginx.conf volume inside the pod. Purely cosmetic, but it
  # is part of the live pod template and several vintages exist across tenants
  # (`config`, the older `conf`, and `mcp-proxy-config`/`nginx-config` in the
  # sidecar shape), so it has to be selectable to take a tenant over without
  # rolling its pod.
  volumeName: config
  # sidecar mode only: nginx:alpine needs writable /var/cache/nginx and /var/run.
  cacheVolumeName: mcp-proxy-cache
  runVolumeName: mcp-proxy-run
  # Env on the nginx container. Inert (nginx reads none of it) but part of the
  # live pod template, and the sets differ per tenant.
  env: []
  livenessProbe: {}
  # Some tenants' proxies carry a tcpSocket readiness check, some don't.
  readinessProbe: {}
  # Name on the proxy Service's port, when the live Service names it.
  servicePortName: ""
  # Overrides the top-level nodeSelector for the proxy only. null inherits; an
  # explicit {} means this pod has none. Both directions occur live.
  nodeSelector: null

# FastAPI admin console + MCP token proxy from this repo (port 8080). Off by
# default: most tenants run the MCP server only. When enabled, /data must be
# persistent or every restart reverts the console password and MCP token.
admin:
  enabled: false
  # Which console this renders:
  #   managed - the one in this repo: seeds /data from a Secret with setdefault,
  #             mounts no ServiceAccount, JWT_SECRET survives a restart.
  #   legacy  - the hand-written console three tenants are running today, seeded
  #             from a ConfigMap by busybox. Reproduced exactly so those three
  #             can be taken over without a restart; moving them to `managed` is
  #             a deliberate, scheduled change.
  mode: managed
  # legacy only. The seed command is carried verbatim because its whitespace is
  # part of the live pod template.
  legacyInitImage: busybox
  legacyInitPullPolicy: Always
  legacyInitConfigMap: ""
  legacySeedCommand: "[ -f /data/config.json ] || cp /init-config/config.json /data/config.json; [ -f /data/mcp_instructions.txt ] || cp /init-config/mcp_instructions.txt /data/mcp_instructions.txt"
  # One live console has serviceAccountName spelled out in its pod template.
  # Empty leaves the field unset (the API server then defaults it).
  serviceAccountName: ""
  # Overrides the top-level nodeSelector for the console only. null inherits;
  # an explicit {} means this pod has none (several live consoles are unpinned
  # while their server is pinned to the control-plane node).
  nodeSelector: null
  service:
    # Name and port list when they differ from the defaults: two live consoles
    # publish a second port that forwards the MCP proxy.
    name: ""
    ports: []
  replicas: 1
  port: 8080
  podAnnotations: {}
  # A claim for the console ALONE. Unlike dataFromPersistence this does not make
  # the server mount it, which matters because the claim is ReadWriteOnce: two
  # pods on different nodes cannot both attach it.
  existingClaim: ""
  # Share the server's /data claim (persistence.*). Off by default: the claim is
  # ReadWriteOnce, so the console and the server would have to land on the same
  # node. With it off the console uses an emptyDir - which is what the live
  # woowtech-odoo console does, and why its password resets on every restart.
  dataFromPersistence: false
  # Seed /data/config.json on first boot from secrets.admin.* with
  # setdefault, never assignment: the console rotates its own password and MCP
  # token at runtime and a plain assignment would revert both on every restart.
  seedConfig: true
  jwtExpiryHours: "12"
  # Browser origins allowed to call the console API. The image defaults to "*";
  # set the tunnel hostname here instead.
  corsOrigins: []
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

networkPolicy:
  # Deny ingress from outside the namespace. The live tenants already have a
  # namespace-wide `default-deny-external` policy created with the tenant, NOT
  # by this chart - leave this off there or the release would own a second,
  # overlapping policy.
  enabled: false

tests:
  # `helm test` smoke pod: MCP server reachable, proxy 403 without the token and
  # proxied with it, admin /healthz. Read-only.
  enabled: true
  # How long the smoke pod keeps retrying a connection before it fails. The MCP
  # server carries no readiness probe (the live Deployments have none), so a
  # `helm test` straight after `helm install` has to wait for it.
  timeoutSeconds: 180
