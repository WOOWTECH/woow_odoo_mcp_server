# Instance values for the markstudio-odoo tenant on woow-k3s.
# Generated from the live Deployment and verified with `kubectl diff`:
# the rendered pod template is byte-identical, so a takeover rolls nothing.
#
# NO SECRETS HERE - the chart only references what already exists:
#   Secret    mcp-odoo-secrets        (Odoo password)
#   ConfigMap mcp-odoo-proxy-config   (proxy token / secret URL path)
#   ConfigMap mcp-admin-config        (/data/config.json)
#
# SAFETY: never set `namespace:` here - placement is `-n` only.

storageClassName: longhorn

odoo:
  url: https://markstudio-odoo.woowtech.io
  db: markstudio
  username: admin
  timeout: "30"
  verifySsl: "1"

secrets:
  create: false
  existingSecret: mcp-odoo-secrets
  passwordKey: odoo-password

server:
  # Taken verbatim off the live container: env ORDER is part of the pod
  # template, so this is what makes the takeover a no-op rollout.
  envOrder:
    - MCP_ADMIN_CONFIG
    - ODOO_URL
    - ODOO_DB
    - ODOO_USERNAME
    - ODOO_PASSWORD
    - ODOO_TIMEOUT
    - ODOO_VERIFY_SSL
    - ODOO_MCP_ENABLE_WRITES
    - ODOO_MCP_ALLOW_DIRECT_WRITES
    - ODOO_MCP_ALLOW_UNKNOWN_METHODS
    - ODOO_MCP_ELICIT_WRITES
    - ODOO_MCP_MAX_ATTACHMENT_BYTES
    - ODOO_MCP_POLICY_FILE
    - MCP_TRANSPORT
    - MCP_HTTP_HOST
    - MCP_HTTP_PORT
    - MCP_HTTP_PATH
    - MCP_ALLOW_REMOTE_HTTP
    - MCP_ALLOWED_HOSTS
    - MCP_CHATTER_DIRECT
  allowedHosts:
    - markstudio-mcp-odoo.woowtech.io
    - localhost
    - mcp-odoo-proxy.markstudio-odoo.svc.cluster.local
    - mcp-odoo.markstudio-odoo.svc.cluster.local
    - 127.0.0.1
  enableWrites: "1"
  allowDirectWrites: "1"
  allowUnknownMethods: "1"
  elicitWrites: "0"
  maxAttachmentBytes: "16777216"
  chatterDirect: "1"
  allowRemoteHttp: "1"
  transport: streamable-http
  # The live command only sources the patch script where the pod actually
  # mounts mcp-odoo-patch; asserting it either way keeps the command identical.
  applyPatches: true
  patchCommandStyle: continuation
  # Part of the live pod template (a past `kubectl rollout restart`). Carried
  # here so a takeover renders the identical template and rolls nothing.
  podAnnotations:
    kubectl.kubernetes.io/restartedAt: "2026-06-25T17:52:58+08:00"

policy:
  enabled: true
  mountPath: /app/odoo_mcp_policy.json

initConfig:
  enabled: true

proxy:
  enabled: true
  volumeName: conf
  readinessProbe:
    failureThreshold: 3
    initialDelaySeconds: 5
    periodSeconds: 10
    successThreshold: 1
    tcpSocket:
      port: 8001
    timeoutSeconds: 1
  # The proxy is pinned to the control-plane node but the server is not.
  nodeSelector:
    node-role.kubernetes.io/control-plane: "true"
  podAnnotations:
    kubectl.kubernetes.io/restartedAt: "2026-06-29T22:00:32+08:00"

persistence:
  enabled: true
  # /data is a live emptyDir, not a PVC: config.json is re-seeded by the
  # init container on every start, so there is nothing to persist.
  emptyDir: true
