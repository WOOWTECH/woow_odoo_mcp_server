# Instance values for the mujimed-odoo tenant on woow-k3s.
# Generated from the live Deployment and verified with `kubectl diff`:
# the rendered pod template is byte-identical, so a takeover rolls nothing.
#
# NO SECRETS HERE - the chart only references what already exists:
#   Secret    mcp-odoo-secrets        (Odoo password)
#   ConfigMap mcp-odoo-proxy-config   (proxy token / secret URL path)
#   ConfigMap mcp-admin-config        (/data/config.json)
#
# SAFETY: never set `namespace:` here - placement is `-n` only.

storageClassName: longhorn

odoo:
  url: https://mujimed-odoo.woowtech.io
  db: mujimed
  username: admin
  timeout: "30"
  verifySsl: "1"

secrets:
  create: false
  existingSecret: mcp-odoo-secrets
  passwordKey: odoo-password

server:
  # Taken verbatim off the live container: env ORDER is part of the pod
  # template, so this is what makes the takeover a no-op rollout.
  envOrder:
    - ODOO_URL
    - ODOO_DB
    - ODOO_USERNAME
    - ODOO_PASSWORD
    - ODOO_TIMEOUT
    - ODOO_VERIFY_SSL
    - MCP_TRANSPORT
    - MCP_HTTP_HOST
    - MCP_HTTP_PORT
    - MCP_HTTP_PATH
    - MCP_ADMIN_CONFIG
    - MCP_ALLOWED_HOSTS
    - MCP_ALLOW_REMOTE_HTTP
    - ODOO_MCP_ENABLE_WRITES
    - ODOO_MCP_ALLOW_DIRECT_WRITES
    - ODOO_MCP_ELICIT_WRITES
    - ODOO_MCP_ALLOW_UNKNOWN_METHODS
    - MCP_CHATTER_DIRECT
    - ODOO_MCP_MAX_ATTACHMENT_BYTES
    - ODOO_MCP_POLICY_FILE
  allowedHosts:
    - mujimed-mcp-odoo.woowtech.io
    - localhost
    - mcp-odoo-proxy.mujimed-odoo.svc.cluster.local
    - mcp-odoo.mujimed-odoo.svc.cluster.local
    - localhost
    - 127.0.0.1
    - localhost:8000
    - localhost
  enableWrites: "1"
  allowDirectWrites: "1"
  allowUnknownMethods: "1"
  elicitWrites: "0"
  maxAttachmentBytes: "16777216"
  chatterDirect: "1"
  allowRemoteHttp: "1"
  transport: streamable-http
  # The live command only sources the patch script where the pod actually
  # mounts mcp-odoo-patch; asserting it either way keeps the command identical.
  applyPatches: false

policy:
  enabled: true
  mountPath: /app/odoo_mcp_policy.json

initConfig:
  enabled: true
  # Reproduced verbatim from the live init container; inert (it only runs
  # `cp`) but part of the pod template, so it must match to avoid a roll.
  env:
    - name: ODOO_MCP_ENABLE_WRITES
      value: "1"
    - name: ODOO_MCP_ALLOW_DIRECT_WRITES
      value: "1"
    - name: ODOO_MCP_ELICIT_WRITES
      value: "0"
    - name: ODOO_MCP_ALLOW_UNKNOWN_METHODS
      value: "1"
    - name: MCP_CHATTER_DIRECT
      value: "1"
    - name: ODOO_MCP_MAX_ATTACHMENT_BYTES
      value: "16777216"
    - name: ODOO_MCP_POLICY_FILE
      value: "/app/odoo_mcp_policy.json"

proxy:
  enabled: true
  volumeName: config
  podAnnotations:
    kubectl.kubernetes.io/restartedAt: "2026-06-24T14:20:26+08:00"

persistence:
  enabled: true
  emptyDir: false
  name: mcp-admin-data
